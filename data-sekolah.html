<head>
    <meta charset="UTF-8">

<body class="bg-gray-50 font-sans">

    <!-- Mobile Overlay -->

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar-transition fixed inset-y-0 left-0 w-64 bg-indigo-900 text-white z-30 transform -translate-x-full md:translate-x-0 overflow-y-auto">
        <div class="p-6 text-2xl font-bold border-b border-indigo-800 flex items-center gap-3">
            <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path></svg>
            LMS Kelas
        </div>
        <nav class="p-4 space-y-1">
            <p class="text-xs text-indigo-400 uppercase font-semibold px-2 mb-2 mt-2">Utama</p>
            <a href="dashboard.html" class="flex items-center gap-3 py-2.5 px-4 rounded-lg text-indigo-100 hover:bg-indigo-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> Dashboard
            </a>
            
            <p class="text-xs text-indigo-400 uppercase font-semibold px-2 mt-6 mb-2">Manajemen</p>
            <a href="data-sekolah.html" class="flex items-center gap-3 py-2.5 px-4 rounded-lg bg-indigo-800 text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg> Data Sekolah
            </a>
            <a href="data-guru.html" class="flex items-center gap-3 py-2.5 px-4 rounded-lg text-indigo-100 hover:bg-indigo-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg> Data Guru
            </a>
            <a href="data-murid.html" class="flex items-center gap-3 py-2.5 px-4 rounded-lg text-indigo-100 hover:bg-indigo-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> Data Murid
            </a>
            
            <p class="text-xs text-indigo-400 uppercase font-semibold px-2 mt-6 mb-2">Akademik</p>
            <a href="absensi.html" class="flex items-center gap-3 py-2.5 px-4 rounded-lg text-indigo-100 hover:bg-indigo-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg> Absensi
            </a>
            <a href="jadwal.html" class="flex items-center gap-3 py-2.5 px-4 rounded-lg text-indigo-100 hover:bg-indigo-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> Jadwal Pelajaran
            </a>
            <a href="materi.html" class="flex items-center gap-3 py-2.5 px-4 rounded-lg text-indigo-100 hover:bg-indigo-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg> Materi & Tugas
            </a>
            <a href="jurnal.html" class="flex items-center gap-3 py-2.5 px-4 rounded-lg text-indigo-100 hover:bg-indigo-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> Jurnal Guru
            </a>
            
            <p class="text-xs text-indigo-400 uppercase font-semibold px-2 mt-6 mb-2">Laporan</p>
            <a href="laporan.html" class="flex items-center gap-3 py-2.5 px-4 rounded-lg text-indigo-100 hover:bg-indigo-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg> Rekap & Cetak
            </a>
        </nav>

        <div class="p-4 mt-8 mb-4">
            <button onclick="logout()" class="flex items-center justify-center gap-2 w-full py-2.5 bg-red-500/20 text-red-300 hover:bg-red-600 hover:text-white rounded-lg text-sm font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> Keluar
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="md:ml-64 flex flex-col min-h-screen">
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10">
            <div class="flex items-center gap-4">
                <button id="menuBtn" class="md:hidden text-gray-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="text-xl font-bold text-gray-800 hidden sm:block">Manajemen Sekolah</div>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                    <div class="text-sm font-bold text-gray-800" id="userName">User</div>
                    <div class="text-xs text-gray-500 capitalize" id="userRole">Role</div>
                </div>
                <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold text-lg" id="userInitial">U</div>
            </div>
        </header>

        <main class="flex-1 p-4 sm:p-6 lg:p-8">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Profil Institusi</h2>
                <p class="text-gray-500 text-sm mt-1">Kelola data profil sekolah, tahun ajaran, dan kepala sekolah.</p>
            </div>

            <!-- Form Data Sekolah -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h3 class="font-bold text-gray-800 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        Informasi Sekolah
                    </h3>
                </div>
                
                <form id="formSekolah" class="p-6">
                    <input type="hidden" id="sch_id">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Identitas -->
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Sekolah *</label>
                                <input type="text" id="sch_nama" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">NPSN</label>
                                <input type="text" id="sch_npsn" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Sekolah</label>
                                <input type="email" id="sch_email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Nomor Telepon</label>
                                <input type="text" id="sch_telp" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>

                        <!-- Akademik & Pimpinan -->
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Tahun Ajaran *</label>
                                <input type="text" id="sch_tahun" placeholder="Contoh: 2026/2027" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Semester Aktif *</label>
                                <select id="sch_semester" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                    <option value="Semester 1">Semester 1 (Ganjil)</option>
                                    <option value="Semester 2">Semester 2 (Genap)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Kepala Sekolah *</label>
                                <input type="text" id="sch_kepsek" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">NIP Kepala Sekolah</label>
                                <input type="text" id="sch_nip_kepsek" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>

                        <!-- Alamat Full Width -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Alamat Lengkap *</label>
                            <textarea id="sch_alamat" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-end gap-3 pt-5 border-t border-gray-100">
                        <button type="button" onclick="loadDataSekolah()" class="px-6 py-2.5 text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg font-semibold transition-colors">
                            Batal / Refresh
                        </button>
                        <button type="submit" id="btnSimpanSekolah" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold flex items-center gap-2 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Script Logika -->
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzlDtL19OHqFoH_CVFSiC0j3dQdHkAModXRVPn_KaZyXfzKcCdzOvBLHw_dOct8I7c6gQ/exec";

        // === CEK LOGIN ===
        const user = JSON.parse(localStorage.getItem('lms_user'));
        if (!user) window.location.href = 'index.html'; 
        else {
            document.getElementById('userName').innerText = user.nama;
            document.getElementById('userRole').innerText = user.role;
            document.getElementById('userInitial').innerText = user.nama.charAt(0).toUpperCase();
        }
		// === SCRIPT SAKTI PENYEMBUNYI MENU UNTUK MURID ===
            if (user.role === 'murid') {
                const linksToHide = ['data-sekolah.html', 'data-guru.html', 'data-murid.html', 'jurnal.html', 'laporan.html'];
                document.querySelectorAll('#sidebar nav a').forEach(link => {
                    if (linksToHide.includes(link.getAttribute('href'))) link.style.display = 'none';
                });
                document.querySelectorAll('#sidebar nav p').forEach(p => {
                    if (p.innerText.includes('Manajemen') || p.innerText.includes('Laporan')) p.style.display = 'none';
                });
                
                // Hilangkan juga Tombol Aksi Cepat (Isi Jurnal) di Dashboard
                const btnJurnal = document.querySelector('a[href="jurnal.html"]');
                if (btnJurnal) btnJurnal.style.display = 'none';
            }

        // === SIDEBAR MOBILE ===
        document.getElementById('menuBtn').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('overlay').classList.toggle('hidden'); });
        document.getElementById('overlay').addEventListener('click', () => { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('overlay').classList.add('hidden'); });

        function logout() { localStorage.removeItem('lms_user'); window.location.href = 'index.html'; }

        // ==========================================
        // READ DATA SEKOLAH DARI DATABASE
        // ==========================================
        async function loadDataSekolah() {
            const btn = document.getElementById('btnSimpanSekolah');
            btn.innerHTML = 'Memuat Data...';
            btn.disabled = true;

            try {
                const response = await fetch(`${GAS_URL}?action=getSekolah`);
                const result = await response.json();
                
                if (result.status === 'success' && result.data) {
                    const d = result.data;
                    document.getElementById('sch_id').value = d.id || '';
                    document.getElementById('sch_nama').value = d.nama_sekolah || '';
                    document.getElementById('sch_npsn').value = d.npsn || '';
                    document.getElementById('sch_email').value = d.email || '';
                    document.getElementById('sch_telp').value = d.telp || '';
                    document.getElementById('sch_tahun').value = d.tahun_ajaran || '';
                    document.getElementById('sch_semester').value = d.semester_aktif || 'Semester 1';
                    document.getElementById('sch_kepsek').value = d.kepala_sekolah || '';
                    document.getElementById('sch_nip_kepsek').value = d.nip_kepsek || '';
                    document.getElementById('sch_alamat').value = d.alamat || '';
                }
            } catch (error) {
                alert('Gagal memuat data sekolah. Periksa koneksi internet.');
            } finally {
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Simpan Perubahan`;
                btn.disabled = false;
            }
        }

        // Jalankan saat halaman pertama dibuka
        window.addEventListener('DOMContentLoaded', loadDataSekolah);

        // ==========================================
        // UPDATE (SIMPAN) DATA SEKOLAH
        // ==========================================
        document.getElementById('formSekolah').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSimpanSekolah');
            btn.disabled = true; 
            btn.innerHTML = 'Menyimpan...';

            const payload = {
                id: document.getElementById('sch_id').value,
                nama_sekolah: document.getElementById('sch_nama').value.trim(),
                npsn: document.getElementById('sch_npsn').value.trim(),
                email: document.getElementById('sch_email').value.trim(),
                telp: document.getElementById('sch_telp').value.trim(),
                tahun_ajaran: document.getElementById('sch_tahun').value.trim(),
                semester_aktif: document.getElementById('sch_semester').value,
                kepala_sekolah: document.getElementById('sch_kepsek').value.trim(),
                nip_kepsek: document.getElementById('sch_nip_kepsek').value.trim(),
                alamat: document.getElementById('sch_alamat').value.trim()
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'editSekolah', payload: payload })
                });
                const result = await response.json();
                
                if(result.status === 'success') {
                    alert('Berhasil! Profil Sekolah sudah diperbarui.');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch(e) { 
                alert('Terjadi kesalahan jaringan.'); 
            } finally { 
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Simpan Perubahan`;
                btn.disabled = false; 
            }
        });
    </script>

<script>
(function(){try{
 const u=JSON.parse(localStorage.getItem('lms_user')||'null');
 const role=String((u&&u.role)||'').toLowerCase(), peran=String((u&&u.peran)||'').toLowerCase();
 if(!u||!(role==='guru'||role==='admin'||peran==='admin')) return;
 const nav=document.querySelector('#sidebar nav'), materi=nav&&nav.querySelector('a[href="materi.html"]');
 if(nav&&materi&&!nav.querySelector('[data-menu-nilai]')){
  const a=document.createElement('a'); a.href='nilai.html'; a.dataset.menuNilai='1';
  a.className='flex items-center gap-3 py-2.5 px-4 rounded-lg text-indigo-100 hover:bg-indigo-800 transition-colors';
  a.innerHTML='<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5-1a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Input Nilai';
  materi.insertAdjacentElement('afterend',a);
 }
 if(location.pathname.toLowerCase().endsWith('/dashboard.html')){
  const group=document.querySelector('#btnIsiJurnal')?.parentElement;
  if(group&&!group.querySelector('[data-quick-nilai]')){const q=document.createElement('a');q.href='nilai.html';q.dataset.quickNilai='1';q.className='px-4 py-2 bg-emerald-600 text-white hover:bg-emerald-700 rounded-lg text-sm font-semibold flex items-center gap-2 transition-colors';q.textContent='＋ Tambah Nilai';group.appendChild(q);}
 }
}catch(e){console.error('Gagal menampilkan menu nilai',e);}})();
</script>
</body>
</html>
